<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` report real
         values instead of zero. Android draws the WebView edge to edge (API 35
         enforces it), so without this the toolbar sits under the status bar and
         the bottom row under the gesture bar — on a device, that reads as buttons
         that cannot be tapped. The insets are consumed in src/styles.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AI Switch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
