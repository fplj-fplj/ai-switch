<!doctype html>
<!-- Static lang is zh-CN. This build ships one language (src/lib/i18n), and the
     only runtime writer of documentElement.lang is I18nProvider — mounted inside
     App on desktop, inside MobileApp on Android. A correct static value covers the
     first paint before either provider's effect runs, so screen readers and CJK
     font fallback are right from the start rather than after hydration. -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` report real
         values instead of zero. Android draws the WebView edge to edge (API 35
         enforces it), so without this the toolbar sits under the status bar and
         the bottom row under the gesture bar — on a device, that reads as buttons
         that cannot be tapped. The insets are consumed in src/styles.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AI Switch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
