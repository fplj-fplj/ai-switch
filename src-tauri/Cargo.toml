[package]
name = "ai-switch"
version = "0.9.0"
description = "AI provider and official account switcher"
authors = ["xyito"]
edition = "2021"
default-run = "ai-switch"

[lib]
name = "ai_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ai-switch"
path = "src/main.rs"

# Behind a feature so a plain `cargo build` — which is what `tauri build` runs —
# produces the desktop binary alone. Tauri bundles every binary the package
# builds into `AI Switch.app/Contents/MacOS`, and this one has no business being
# there: nothing in the app launches it, it ships as its own archive, and on
# x86_64 macOS it broke the release outright. arm64's linker ad-hoc signs every
# binary it emits, so the stray copy was signable there, while the Intel runner
# left it unsigned and `codesign` refused the whole bundle over the unsigned
# nested code. `pnpm server:build*` passes the feature explicitly.
[[bin]]
name = "ai-switch-server"
path = "src/bin/ai_switch_server.rs"
required-features = ["standalone-server"]

[features]
default = ["desktop"]
desktop = [
  "dep:tauri",
  "tauri/default",
  "tauri/tray-icon",
  "dep:tauri-plugin-autostart",
  "dep:tauri-plugin-deep-link",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-process",
  "dep:tauri-plugin-single-instance",
  "dep:tauri-plugin-updater",
  "terminal",
]
standalone-server = ["terminal"]

# The interactive terminal subsystem (agent sessions over a PTY). Both the
# desktop app and the standalone server run it. The Android build cannot: there
# is no PTY for it to attach to, and `portable-pty`'s Unix dependency chain
# (nix / serial / termios / filedescriptor) is not something to bet a cross
# compile on. Pulling it out of `desktop` into its own feature keeps the
# standalone server's behaviour exactly as it was while giving `mobile` a way to
# leave it behind.
terminal = ["dep:portable-pty"]

# The Android app. Tauri 2 mobile still links the `tauri` crate — that is not
# optional — but none of the desktop plugins apply, and neither does
# `tray-icon` (which is why it moved out of the dependency declaration below and
# into `desktop`; cargo features on a dependency are global, so leaving it there
# would have handed it to Android too). Built with
# `tauri android build -f mobile -- --no-default-features`.
mobile = [
  "dep:tauri",
  "tauri/default",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", optional = true, default-features = false }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.20.2"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "sync", "process", "signal", "time"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "postgres", "migrate", "macros", "chrono", "uuid", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
directories = "5"
keyring = "3"
sha2 = "0.10"
argon2 = "0.5.3"
tempfile = "3"
url = "2"
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
tower-http = { version = "0.6", features = ["cors"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "system-proxy", "cookies", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"
portable-pty = { version = "0.8", optional = true }
rcgen = { version = "0.13", features = ["x509-parser"] }
sha1 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
x509-parser = "0.16"
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Console"] }
winreg = "0.52"

# `statvfs`, for reading free space on the volumes the app writes to.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_fs = "1"
