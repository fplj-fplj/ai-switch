name: CI

# Stage 0 of the Android port needs two things CI-only, because the machine this
# is developed on has no Rust toolchain, no JDK and no pnpm — nothing here can be
# run locally, so CI is the only feedback loop that exists.
#
#   1. desktop-regression — the upstream v0.9.0 baseline must stay green. Every
#      Android change is supposed to be invisible to the desktop build, and this
#      job is the only proof of that.
#   2. android-cross-check — the target the port is actually for.
#
# Toolchain versions and Linux build dependencies are copied from release.yml so
# that CI and the release builds agree on what "compiles" means.

on:
  push:
    branches: [android, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-regression:
    name: Desktop regression (typecheck + vitest + cargo test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tauri-build's build script needs pkg-config and the GTK/WebKit headers
      # even for `cargo test`; without them the crate fails to configure.
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      # Must precede setup-node so its pnpm cache resolution can find pnpm.
      # Version comes from the packageManager field in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test:run

      - name: Rust tests
        run: pnpm rust:test

  android-cross-check:
    name: Android cross-check (aarch64-linux-android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `--features mobile` cannot resolve until the feature is declared, which is
      # the task right after this workflow. Skipping rather than failing keeps the
      # first baseline run meaningful: with the feature absent, a red desktop job
      # can only mean CI itself is broken, not that the port is half-finished. The
      # job switches itself on the moment `mobile` appears in src-tauri/Cargo.toml.
      - name: Detect the mobile cargo feature
        id: mobile-feature
        run: |
          if grep -qE '^[[:space:]]*mobile[[:space:]]*=' src-tauri/Cargo.toml; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Android cross-check skipped::src-tauri/Cargo.toml declares no 'mobile' feature yet."
          fi

      - name: Setup Rust
        if: steps.mobile-feature.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build artifacts
        if: steps.mobile-feature.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      # `cargo check` does not link, but it does run build scripts — and `ring`
      # and `cc` compile C for the *target* triple, so a working NDK clang is
      # needed even for a plain check. The runner image already ships an NDK, so
      # use that instead of installing a second copy.
      - name: Export Android NDK toolchain
        if: steps.mobile-feature.outputs.present == 'true'
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$ndk" ]; then
            ndk="$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk" \
              -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          fi
          [ -d "$ndk" ] || { echo "::error::no Android NDK found on this runner"; exit 1; }

          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          api=24
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android${api}-clang"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android${api}-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
          } >> "$GITHUB_ENV"
          echo "Using NDK: $ndk"

      - name: cargo check --target aarch64-linux-android
        if: steps.mobile-feature.outputs.present == 'true'
        working-directory: src-tauri
        run: cargo check --target aarch64-linux-android --no-default-features --features mobile
