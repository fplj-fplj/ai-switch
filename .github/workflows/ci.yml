name: CI

# Stage 0 of the Android port needs two things CI-only, because the machine this
# is developed on has no Rust toolchain, no JDK and no pnpm — nothing here can be
# run locally, so CI is the only feedback loop that exists.
#
#   1. desktop-regression — the upstream v0.9.0 baseline must stay green. Every
#      Android change is supposed to be invisible to the desktop build, and this
#      job is the only proof of that.
#   2. android-cross-check — the target the port is actually for.
#
# Toolchain versions and Linux build dependencies are copied from release.yml so
# that CI and the release builds agree on what "compiles" means.

on:
  push:
    branches: [android, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-regression:
    name: Desktop regression (typecheck + vitest + cargo test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tauri-build's build script needs pkg-config and the GTK/WebKit headers
      # even for `cargo test`; without them the crate fails to configure.
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      # Must precede setup-node so its pnpm cache resolution can find pnpm.
      # Version comes from the packageManager field in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # The tauri-build build script runs for the desktop feature and validates
      # every path tauri.conf.json declares — including the tsnet sidecar in
      # `externalBin`. Upstream builds that Go binary before touching cargo for
      # exactly this reason; see "Build sidecar binary" below.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: sidecar/ai-switch-tsnet/go.sum

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test:run

      # tauri.conf.json declares two paths that must exist on disk before
      # tauri-build will configure the crate: the frontend bundle (`../dist`,
      # mapped to `web/`) and the tsnet sidecar in `externalBin`. Both are build
      # artifacts and gitignored, so a fresh checkout has neither and cargo
      # fails with "resource path ... doesn't exist" before a single test runs.
      # release.yml produces them in this order too. `dist/` only needs to
      # exist, not be current — nothing here runs the app.
      - name: Build frontend assets
        run: pnpm build

      - name: Build sidecar binary
        run: |
          set -euo pipefail
          host_triple="$(rustc -vV | sed -n 's/^host: //p')"
          out="src-tauri/binaries/ai-switch-tsnet-${host_triple}"
          mkdir -p src-tauri/binaries
          (cd sidecar/ai-switch-tsnet \
            && go build -trimpath -ldflags="-s -w" -o "../../${out}" .)
          test -f "$out"

      - name: Rust tests
        run: pnpm rust:test

      # The Android port moves the terminal subsystem out of `desktop` into its own
      # `terminal` feature, which `standalone-server` also selects. release.yml
      # exercised that configuration and this workflow did not, so a regression
      # there would have surfaced only at release time.
      - name: Check standalone server
        run: pnpm server:check

  android-cross-check:
    name: Android cross-check (aarch64-linux-android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `--features mobile` cannot resolve until the feature is declared, which is
      # the task right after this workflow. Skipping rather than failing keeps the
      # first baseline run meaningful: with the feature absent, a red desktop job
      # can only mean CI itself is broken, not that the port is half-finished. The
      # job switches itself on the moment `mobile` appears in src-tauri/Cargo.toml.
      - name: Detect the mobile cargo feature
        id: mobile-feature
        run: |
          if grep -qE '^[[:space:]]*mobile[[:space:]]*=' src-tauri/Cargo.toml; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Android cross-check skipped::src-tauri/Cargo.toml declares no 'mobile' feature yet."
          fi

      - name: Setup Rust
        if: steps.mobile-feature.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build artifacts
        if: steps.mobile-feature.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      # `cargo check` does not link, but it does run build scripts — and `ring`
      # and `cc` compile C for the *target* triple, so a working NDK clang is
      # needed even for a plain check. The runner image already ships an NDK, so
      # use that instead of installing a second copy.
      - name: Export Android NDK toolchain
        if: steps.mobile-feature.outputs.present == 'true'
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$ndk" ]; then
            ndk="$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk" \
              -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          fi
          [ -d "$ndk" ] || { echo "::error::no Android NDK found on this runner"; exit 1; }

          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          api=24
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android${api}-clang"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android${api}-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
          } >> "$GITHUB_ENV"
          echo "Using NDK: $ndk"

      # tauri-build validates `externalBin` and `resources` for every Tauri target,
      # Android included (crates/tauri-build/src/lib.rs copies both without a mobile
      # guard), and a fresh checkout has neither: `dist/` and the sidecar binary are
      # gitignored build artifacts. This job only asks whether the crate compiles
      # for Android, so it satisfies the path checks with stand-ins rather than
      # paying for a Vite build and a Go cross-compile. The desktop job already
      # builds the real ones, so their correctness is covered elsewhere.
      - name: Stub packaging artifacts
        if: steps.mobile-feature.outputs.present == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist src-tauri/binaries
          : > src-tauri/binaries/ai-switch-tsnet-aarch64-linux-android

      - name: cargo check --target aarch64-linux-android
        if: steps.mobile-feature.outputs.present == 'true'
        working-directory: src-tauri
        run: cargo check --target aarch64-linux-android --no-default-features --features mobile

  # Produces the installable artifact. Deliberately behind `workflow_dispatch` and
  # behind `android-cross-check`: a Gradle + Rust cross-compile round is expensive,
  # and there is no point starting one when the crate does not compile for Android.
  android-apk:
    name: Android APK (aarch64)
    runs-on: ubuntu-latest
    needs: android-cross-check
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # `NDK_HOME` has to be exported explicitly. The Tauri CLI looks for that exact
      # variable and reports the NDK as missing even when it is installed.
      - name: Install Android NDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-apk

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: sidecar/ai-switch-tsnet/go.sum

      # Must precede setup-node so its pnpm cache resolution can find pnpm.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri-build copies `externalBin` for the *target* triple, so Android needs
      # its own sidecar — the host build the desktop job does is not it.
      - name: Build sidecar binary for Android
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          out="src-tauri/binaries/ai-switch-tsnet-aarch64-linux-android"
          (cd sidecar/ai-switch-tsnet \
            && GOOS=android GOARCH=arm64 CGO_ENABLED=0 \
               go build -trimpath -ldflags="-s -w" -o "../../${out}" .)
          test -s "$out"

      - name: Init the Android project
        run: pnpm tauri android init --ci

      # `--no-default-features` is not optional here: `default = ["desktop"]`, and
      # the Tauri CLI's build path adds only `tauri/custom-protocol` — unlike its
      # dev path, it does not re-add the manifest's default features on your behalf.
      # Without the flag the desktop plugins get compiled for Android and the build
      # dies long before it reaches Gradle. `tauri android build` runs
      # `beforeBuildCommand` (`pnpm build`) itself, so `dist/` is produced here.
      - name: Build the APK
        run: pnpm tauri android build --apk -t aarch64 -f mobile -- --no-default-features

      # Gradle emits an unsigned release APK and Android will not install one. A
      # throwaway self-signed key is enough to sideload for testing, and it keeps
      # the workflow free of repository secrets. zipalign must precede signing —
      # it rewrites the archive and would invalidate a signature applied first.
      # Signed with the repository's release key when it is configured, so an
      # upgrade installs over the previous build instead of demanding an uninstall
      # first. Secrets rather than a committed keystore: the key is the app's
      # identity, and anyone holding it can publish an update your device accepts.
      # A fork without the secrets still builds — it just falls back to a throwaway
      # key, which is also what every build here used to do.
      - name: Sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          build_tools="$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)"
          unsigned="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)"
          [ -n "$unsigned" ] || { echo "::error::the build produced no APK"; exit 1; }

          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "Signing with the repository release key."
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > /tmp/release.keystore
            ks_args=(--ks /tmp/release.keystore
                     --ks-pass "pass:${KEYSTORE_PASSWORD}"
                     --key-pass "pass:${KEY_PASSWORD}"
                     --ks-key-alias "${KEY_ALIAS}")
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a throwaway key, so this APK cannot be installed over a previous one."
            keytool -genkeypair -v -keystore /tmp/release.keystore -alias ai-switch \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=AI Switch Android, O=AI Switch, C=US"
            ks_args=(--ks /tmp/release.keystore --ks-pass pass:android --key-pass pass:android)
          fi

          "$build_tools/zipalign" -f 4 "$unsigned" /tmp/aligned.apk
          "$build_tools/apksigner" sign "${ks_args[@]}" \
            --out ai-switch-android-aarch64.apk /tmp/aligned.apk
          "$build_tools/apksigner" verify --print-certs ai-switch-android-aarch64.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-switch-android-aarch64
          path: ai-switch-android-aarch64.apk
          if-no-files-found: error

      # Everything else in the mobile work lands in this project: the foreground
      # service and its notification, the overlay permission, the boot receiver,
      # and the plugin registration. It can only be produced by the Tauri CLI,
      # which needs an Android toolchain this machine does not have — so the build
      # that generates it also hands it back, and it gets committed from there.
      - name: Upload the generated Android project
        uses: actions/upload-artifact@v4
        with:
          name: android-project
          path: src-tauri/gen/android
          if-no-files-found: error
          include-hidden-files: true
